<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North Carolina Data Center Moratoria</title>
<meta name="description" content="Data center moratoria, bans, and related actions by North Carolina counties, municipalities, and tribal governments, with a source for every action.">
<meta property="og:type" content="website">
<meta property="og:title" content="North Carolina Data Center Moratoria">
<meta property="og:description" content="An open map of local data center moratoria in North Carolina, with a source for every action and uncertain records marked as uncertain.">
<meta property="og:url" content="https://joshchilders11-rgb.github.io/nc-data-center-moratoria/">
<meta property="og:image" content="https://joshchilders11-rgb.github.io/nc-data-center-moratoria/data/map.png">
<meta property="og:image:width" content="1800">
<meta property="og:image:height" content="942">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink: #1f2328; --muted: #57606a; --line: #d0d7de; --panel: rgba(255, 255, 255, 0.96); }
  html, body { height: 100%; margin: 0; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color: var(--ink); }
  #map { position: absolute; inset: 0; background: #f6f8fa; }
  /* Gray the basemap so the four categories carry the color. */
  .leaflet-tile-pane { filter: grayscale(1) brightness(1.08) contrast(0.8); }
  .panel { position: absolute; z-index: 1000; background: var(--panel); border: 1px solid var(--line);
           border-radius: 8px; box-shadow: 0 1px 4px rgba(31, 35, 40, 0.12); }
  #header { top: 12px; left: 12px; max-width: 380px; padding: 12px 14px; }
  #header h1 { margin: 0 0 4px; font-size: 18px; line-height: 1.25; }
  #header p { margin: 0; color: var(--muted); }
  #header .headline { margin: 6px 0; color: var(--ink); }
  #header .links { margin-top: 8px; font-size: 13px; }
  a { color: #0969da; }
  #legend { bottom: 24px; left: 12px; padding: 0; }
  #legend summary { cursor: pointer; padding: 8px 12px; font-weight: 600; }
  #legend .body { padding: 0 12px 10px; }
  #legend .row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  #legend .sw { width: 22px; height: 14px; flex: none; box-sizing: border-box; border-radius: 2px; }
  #legend hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; }
  .pop h3 { margin: 0; font-size: 15px; }
  .pop .meta { color: var(--muted); margin-bottom: 6px; }
  .pop .cat { display: inline-block; padding: 1px 8px; border-radius: 10px; color: #fff; font-weight: 600; font-size: 12px; }
  .pop .cat.none { background: #fff; color: var(--muted); border: 1px solid var(--line); }
  .pop .flag { margin: 8px 0; padding: 6px 8px; background: #fff8c5; border-left: 3px solid #111; }
  .pop .upd { margin: 8px 0; padding: 6px 8px; background: #ddf4ff; border-left: 3px solid #0969da; }
  .pop dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 8px 0; }
  .pop dt { color: var(--muted); }
  .pop dd { margin: 0; }
  .pop .note { grid-column: 1 / -1; color: #7d4e00; }
  #error { top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 14px 16px; display: none; }
  @media (max-width: 600px) {
    #header { right: 12px; max-width: none; padding: 10px 12px; }
    #header h1 { font-size: 16px; }
    #header .extra { display: none; }
    #legend { bottom: 30px; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of North Carolina data center moratoria"></div>

<div id="header" class="panel">
  <h1>North Carolina data center moratoria</h1>
  <p class="headline" id="headline">Loading…</p>
  <p class="extra">Click any shape for its details. The map shows what local governments have
    decided about new data centers, not where data centers are.</p>
  <p class="links"><a href="https://github.com/joshchilders11-rgb/nc-data-center-moratoria">Data, method &amp; caveats</a>
    | <a href="data/nc_data_center_moratoriums.csv">CSV</a>
    | <a href="data/nc_datacenter_moratoria.geojson">GeoJSON</a></p>
</div>

<details id="legend" class="panel" open>
  <summary>Legend</summary>
  <div class="body" id="legend-body"></div>
</details>

<div id="error" class="panel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  "use strict";

  // Legend swatches mirror style() in build/build_layer.py.
  var CATEGORIES = [
    ["Moratorium or ban in effect", "#B2182B"],
    ["Under consideration", "#8073AC"],
    ["Ended, declined, or replaced", "#758CA3"],
    ["No action found", null]
  ];
  var COLOR = {};
  CATEGORIES.forEach(function (c) { COLOR[c[0]] = c[1]; });

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function hexAlpha(hex, alpha) {
    var n = parseInt(hex.slice(1), 16);
    return "rgba(" + (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + alpha + ")";
  }

  function legend() {
    var rows = CATEGORIES.map(function (c) {
      var sw = c[1]
        ? "background:" + hexAlpha(c[1], 0.45) + ";border:1px solid #fff"
        : "background:#fff;border:1px solid #b0b8c0";
      return '<div class="row"><span class="sw" style="' + sw + '"></span>' + esc(c[0]) + "</div>";
    });
    rows.push("<hr>");
    rows.push('<div class="row"><span class="sw" style="background:' + hexAlpha("#B2182B", 0.45) +
              '"></span>County action: filled</div>');
    rows.push('<div class="row"><span class="sw" style="background:' + hexAlpha("#B2182B", 0.15) +
              ';border:2.5px solid #B2182B"></span>City, town, or tribal: outlined</div>');
    rows.push('<div class="row"><span class="sw" style="border:3px solid #111"></span>Still needs confirmation</div>');
    document.getElementById("legend-body").innerHTML = rows.join("");
  }

  function popup(p) {
    var where = p.level === "Municipality" ? "Municipality in " + p.county + " County" : p.level;
    var color = COLOR[p.category];
    var html = ['<div class="pop"><h3>' + esc(p.name) + "</h3>",
                '<div class="meta">' + esc(where) + "</div>",
                color ? '<span class="cat" style="background:' + color + '">' + esc(p.category) + "</span>"
                      : '<span class="cat none">' + esc(p.category) + "</span>"];
    if (p.needs_confirmation === "yes") {
      html.push('<div class="flag"><strong>Needs confirmation.</strong> ' + esc(p.confirmation_note || "") + "</div>");
    }
    if (p.updated) {
      html.push('<div class="upd"><strong>Updated ' + esc(p.updated) + ".</strong> " + esc(p.update_note || "") + "</div>");
    }
    var fields = [["Covers", p.covers], ["Duration", p.duration], ["Adopted", p.adopted], ["Expires", p.expires]];
    var dl = fields.filter(function (f) { return f[1]; })
      .map(function (f) { return "<dt>" + f[0] + "</dt><dd>" + esc(f[1]) + "</dd>"; });
    if (p.expiration_note) dl.push('<div class="note">' + esc(p.expiration_note) + "</div>");
    dl.push("<dt>Status in table</dt><dd>" + esc(String(p.status).replace(/_/g, " ")) + "</dd>");
    dl.push("<dt>Date confidence</dt><dd>" + esc(p.confidence) + "</dd>");
    html.push("<dl>" + dl.join("") + "</dl>");
    if (p.source && /^https?:\/\//i.test(p.source)) {
      html.push('<a href="' + esc(p.source) + '" target="_blank" rel="noopener noreferrer">Source ↗</a>');
    }
    html.push("</div>");
    return html.join("");
  }

  function fail(message) {
    var el = document.getElementById("error");
    el.textContent = message;
    el.style.display = "block";
  }

  legend();
  if (window.matchMedia("(max-width: 600px)").matches) {
    document.getElementById("legend").removeAttribute("open");
  }

  var map = L.map("map", { zoomControl: false, zoomSnap: 0.25 }).setView([35.4, -79.4], 7);
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // Until the reader touches the map, keep the whole state in view: in-app
  // browsers and rotating phones resize the page after it loads.
  var interacted = false;
  ["mousedown", "touchstart", "wheel", "keydown"].forEach(function (type) {
    map.getContainer().addEventListener(type, function () { interacted = true; }, { passive: true });
  });

  fetch("data/nc_datacenter_moratoria.geojson")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      // Features arrive in draw order: counties, municipalities, tribal nation.
      var layer = L.geoJSON(data, {
        style: function (f) {
          var p = f.properties;
          return { fillColor: p.fill, fillOpacity: p["fill-opacity"], color: p.stroke,
                   weight: p["stroke-width"], opacity: p["stroke-opacity"] };
        },
        onEachFeature: function (f, l) {
          // Pan popups clear of the header panel, not just the map edge.
          var top = document.getElementById("header").offsetHeight + 24;
          l.bindPopup(popup(f.properties), { maxWidth: 320, autoPanPaddingTopLeft: L.point(12, top) });
        }
      }).addTo(map);
      // A map with no size yet (a hidden tab) would fit the state at maximum
      // zoom, so fit only once it has one.
      var fit = function () {
        var size = map.getSize();
        if (size.x > 0 && size.y > 0) map.fitBounds(layer.getBounds(), { padding: [12, 12] });
      };
      fit();
      map.on("resize", function () { if (!interacted) fit(); });
    })
    .catch(function () { fail("The map layer could not be loaded. The data is in the GitHub repository."); });

  fetch("data/summary.json")
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (s) {
      var d = new Date(s.status_as_of + "T12:00:00");
      var when = d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      document.getElementById("headline").textContent =
        "As of " + when + ": " + s.by_category["Moratorium or ban in effect"] +
        " moratoria or bans in effect, " + s.in_effect_needing_confirmation + " of them still needing confirmation.";
    })
    .catch(function () { document.getElementById("headline").textContent = ""; });
})();
</script>
</body>
</html>
