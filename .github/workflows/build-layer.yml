name: Build layer

# Rebuilds the GeoJSON, map picture, summary counts and README numbers whenever
# the research table or the build scripts change, so the published layer can
# never drift from the CSV it is derived from.
on:
  push:
    branches: [main]
    paths:
      - "data/nc_data_center_moratoriums.csv"
      - "data/research_updates.csv"
      - "build/**"
      - ".github/workflows/build-layer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build/requirements.txt

      - name: Install dependencies
        run: pip install -r build/requirements.txt

      - name: Build layer
        run: python build/build_layer.py

      - name: Draw map picture
        run: python build/render_map.py

      - name: Commit rebuilt files if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nc_datacenter_moratoria.geojson data/summary.json data/map.png README.md
          if git diff --cached --quiet; then
            echo "Layer unchanged."
          else
            git commit -m "Rebuild layer from research table"
            git push
          fi
